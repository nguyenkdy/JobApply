server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/account/ { proxy_pass http://account:8000/; proxy_read_timeout 20s; }
    location /api/job/ { proxy_pass http://job:8000/; proxy_read_timeout 20s; }
    location /api/application/ { proxy_pass http://application:8000/; proxy_read_timeout 20s; }
    location / { try_files $uri $uri/ /index.html; }
}
